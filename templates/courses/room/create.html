{% extends 'base.html' %}
{% block content %}
<style>
    .create-room-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: radial-gradient(circle at top, #f0f4ff 0%, #e8edff 100%);
    }

    .create-room-card {
        position: relative;
        background: #ffffff;
        border-radius: 24px;
        padding: 45px 45px 40px;
        box-shadow: 0 20px 50px rgba(79, 92, 231, 0.18), 0 0 0 1px rgba(79, 92, 231, 0.06);
        max-width: 480px;
        width: 100%;
        overflow: hidden;
        animation: popIn 0.4s ease;
    }

    @keyframes popIn {
        from { opacity: 0; transform: scale(0.94) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .create-room-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
    }

    .icon-circle {
        width: 70px;
        height: 70px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .create-room-card h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 6px;
        color: #2d2d2d;
        text-align: center;
        letter-spacing: -0.3px;
    }

    .create-room-card .subtitle {
        font-size: 14px;
        color: #999;
        text-align: center;
        margin-bottom: 28px;
    }

    form p {
        margin-bottom: 18px;
    }

    form label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #444;
        margin-bottom: 7px;
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="number"],
    form input[type="password"],
    form input[type="url"],
    form select,
    form textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #e5e7ff;
        border-radius: 12px;
        font-size: 15px;
        color: #2d2d2d;
        background: #f8f9ff;
        transition: all 0.2s ease;
        box-sizing: border-box;
        font-family: inherit;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
        outline: none;
        border-color: #667eea;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
    }

    form textarea {
        min-height: 90px;
        resize: vertical;
    }

    form ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
        color: #ee5a6f;
        font-size: 13px;
        font-weight: 600;
    }

    .btn-save {
        width: 100%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        padding: 14px 0;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        margin-top: 8px;
    }

    .btn-save:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(102, 126, 234, 0.5);
    }

    .btn-save:active {
        transform: translateY(0);
    }
</style>

<div class="create-room-wrapper">
    <div class="create-room-card">
        <div class="icon-circle">🚪</div>
        <h1>Create Room</h1>
        <p class="subtitle">Fill in the details below to create a new room</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-save">Save</button>
        </form>
    </div>
</div>
{% endblock %}
