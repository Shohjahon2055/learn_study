{% extends 'base.html' %}
{% block content %}
<style>
    .delete-group-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: radial-gradient(circle at top, #fff5f5 0%, #ffe8e8 100%);
    }

    .delete-group-card {
        position: relative;
        background: #ffffff;
        border-radius: 24px;
        padding: 45px 45px 40px;
        box-shadow: 0 20px 50px rgba(238, 90, 111, 0.25), 0 0 0 1px rgba(238, 90, 111, 0.08);
        text-align: center;
        max-width: 460px;
        width: 100%;
        overflow: hidden;
        animation: popIn 0.4s ease;
    }

    @keyframes popIn {
        from { opacity: 0; transform: scale(0.92) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .delete-group-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, #ff6b6b, #ee5a6f, #ff8787);
    }

    .icon-circle {
        width: 78px;
        height: 78px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff8787, #ee5a6f);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        box-shadow: 0 10px 25px rgba(238, 90, 111, 0.4);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { box-shadow: 0 10px 25px rgba(238, 90, 111, 0.4); }
        50% { box-shadow: 0 10px 35px rgba(238, 90, 111, 0.6); }
    }

    .delete-group-card h1 {
        font-size: 24px;
        font-weight: 800;
        margin-bottom: 14px;
        color: #2d2d2d;
        letter-spacing: -0.3px;
    }

    .delete-group-card .subtitle {
        font-size: 15px;
        color: #999;
        margin-bottom: 22px;
    }

    .delete-group-card h3 {
        font-size: 16px;
        font-weight: 500;
        line-height: 1.7;
        margin-bottom: 32px;
        color: #4a4a4a;
        background: #fff5f5;
        border: 1px solid #ffe0e0;
        padding: 18px 22px;
        border-radius: 14px;
    }

    .delete-group-card h3 b {
        font-weight: 700;
        color: #ee5a6f;
    }

    .btn-group {
        display: flex;
        gap: 14px;
        justify-content: center;
    }

    .btn-confirm {
        background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        color: #fff;
        border: none;
        padding: 13px 32px;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 8px 20px rgba(238, 90, 111, 0.35);
        flex: 1;
    }

    .btn-confirm:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(238, 90, 111, 0.5);
    }

    .btn-confirm:active {
        transform: translateY(0);
    }

    .btn-cancel {
        background: #f5f5f5;
        color: #666;
        border: none;
        padding: 13px 32px;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        flex: 1;
    }

    .btn-cancel:hover {
        background: #e8e8e8;
        color: #333;
        transform: translateY(-3px);
    }
</style>

<div class="delete-group-wrapper">
    <div class="delete-group-card">
        <div class="icon-circle">🗑️</div>
        <h1>Guruhni o'chirish</h1>
        <p class="subtitle">Bu amalni ortga qaytarib bo'lmaydi</p>
        <form method="post">
            {% csrf_token %}
            <h3>Siz rostdan ham <b>{{ group.title }}</b> guruhini o'chirmoqchimisiz?</h3>
            <div class="btn-group">
                <a href="{% url 'list-groups' %}" class="btn-cancel">Bekor qilish</a>
                <button type="submit" class="btn-confirm">Ha, o'chirish</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
